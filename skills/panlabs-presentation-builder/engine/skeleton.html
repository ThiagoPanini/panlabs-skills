><i></i></span></div><div class=rail><b></b></div><div class=wrap><div class=viz><!--P:FIGURE--></div><div class=prose><!--P:BEATS--></div></div><div class="foot ok-overlap"><span><!--P:OCCASION--></span><span class=fn><span class=fpos></span></span></div><script>
const q=new URLSearchParams(location.search);
if(q.get('still')){document.body.setAttribute('data-still','');
  document.documentElement.style.scrollBehavior='auto'}
const beats=[...document.querySelectorAll('.beat')];
const fig=document.querySelector('.viz');
// THE SEAM (#120): which figure is showing is a property of the BEAT,
// not of the scroll. `data-f` is written by the builder and carried by
// every beat, so the swap happens exactly where the argument changes
// subject -- and `active()` stays the one and only reader of position.
const figs=[...fig.children].filter(e=>e.classList.contains('fg'));
const rail=document.querySelector('.rail');
// The dots are DERIVED from the beat count, never emitted by the builder:
// one fewer thing that can disagree with the column.
beats.forEach((_,n)=>{const i=document.createElement('i');
  i.style.top=(beats.length>1?n/(beats.length-1)*100:0).toFixed(2)+'%';
  rail.appendChild(i)});
const dots=[...rail.querySelectorAll('i')];
const fill=rail.querySelector('b');
// NO IntersectionObserver: the observer is ASYNCHRONOUS, and a measurer that
// scrolls and measures in the same tick reads the PREVIOUS state -- which is
// how the #105 linear-coverage score came out at 6%, a number that was false.
// The active beat is the one covering the centre of the READING ZONE (the
// bottom half; the top half belongs to the figure). Synchronous count, same
// answer, and testable from a script.
function active(){
  const mid=innerHeight*0.75;let best=0,bd=1e9;
  beats.forEach((s,n)=>{const r=s.getBoundingClientRect();
    const d=Math.abs((r.top+r.bottom)/2-mid);if(d<bd){bd=d;best=n}});
  return best;
}
function draw(){
  const a=active();
  fig.dataset.s=a+1;
  const f=+(beats[a].dataset.f||0);
  figs.forEach((e,n)=>e.classList.toggle('on',n===f));
  const lit=(beats[a].dataset.lit||'').split(' ').filter(Boolean);
  (figs[f]||fig).querySelectorAll('[data-i]').forEach(e=>
    e.classList.toggle('lit',lit.includes(e.dataset.i)));
  dots.forEach((e,n)=>{e.classList.toggle('now',n===a);
                       e.classList.toggle('done',n<a)});
  const h=document.documentElement.scrollHeight-innerHeight;
  fill.style.height=(h?Math.min(1,scrollY/h):0)*100+'%';
  document.querySelector('.fpos').textContent=(a+1)+' / '+beats.length;
}
addEventListener('scroll',draw,{passive:true});
addEventListener('resize',draw);
// `scrollIntoView()` ALIGNS TO THE TOP OF THE VIEWPORT, and the top of the
// viewport is exactly where the pinned figure lives. Using the default throws
// the beat behind it: the key "works" -- the page scrolls -- and what you see
// is the figure and a gap. The right target is the reading zone, by the same
// count `active()` uses.  (`offsetTop` is relative to the offsetParent, not
// the document; with `.prose` positioned it is off by the pinned band's
// height. rect + scrollY is absolute.)
function goto(n){
  const s=beats[Math.max(0,Math.min(beats.length-1,n))];
  const r=s.getBoundingClientRect();
  scrollTo(0,Math.max(0,r.top+scrollY-(innerHeight*0.75-r.height/2)));
  draw();
}
addEventListener('keydown',e=>{
  const k=e.key;const a=active();
  if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();goto(a+1)}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();goto(a-1)}
  else if(k==='Home'){e.preventDefault();scrollTo(0,0);draw()}
  else if(k==='End'){e.preventDefault();goto(beats.length-1)}
});
window.__seq=beats.map((s,n)=>({l:'p'+(n+1),f:()=>goto(n)}));
const only=+q.get('only')||0;
if(only){
  document.body.setAttribute('data-only','');
  beats[Math.min(beats.length,only)-1].classList.add('only');
  draw.call(null);
  const a=only-1;fig.dataset.s=only;
  const f=+(beats[a].dataset.f||0);
  figs.forEach((e,n)=>e.classList.toggle('on',n===f));
  const lit=(beats[a].dataset.lit||'').split(' ').filter(Boolean);
  (figs[f]||fig).querySelectorAll('[data-i]').forEach(e=>
    e.classList.toggle('lit',lit.includes(e.dataset.i)));
  dots.forEach((e,n)=>{e.classList.toggle('now',n===a);
                       e.classList.toggle('done',n<a)});
  document.querySelector('.fpos').textContent=only+' / '+beats.length;
}else{
  const s0=+q.get('p')||0;
  if(s0)beats[Math.min(beats.length,s0)-1].scrollIntoView();
  draw();
}
