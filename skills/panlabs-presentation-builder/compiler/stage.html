<!doctype html>
<!-- THE STAGE. The compiler copies this file and fills its holes; no line of
     it is ever written per deck, which is what makes two decks the same
     identity instead of two approximations of one.

     A HOLE IS A NAME IN DOUBLE BRACES, AND APPEARS EXACTLY ONCE. The
     compiler refuses a skeleton where a marker appears zero times or twice --
     zero means the content silently vanished, twice means half the page
     disagrees with the other half, and both ship a deck that looks built. It
     also refuses to write a page where a marker survived the filling.

     Everything the deck needs travels inside it: the theme is inlined above,
     the script below is inline, and there is not one external reference on
     this page. That is the whole of "opens with the cable pulled". -->
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* ── the theme, inlined ─────────────────────────────────────────────────── */
{{THEME}}

/* ── the stage ──────────────────────────────────────────────────────────────
 * 16:9, centred in the window, and never scrolling. The window is whatever
 * the room's projector happens to be; the stage is the deck. Both edges are
 * derived from the same pair of constraints, so the box is always exactly
 * 16:9 and always as large as the window allows.
 *
 * There is no letterbox colour. The surround is the surface, because a
 * painted frame around the slide is furniture the room did not ask for --
 * and on a 16:9 projector there is no surround at all.
 */
*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: var(--surface);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--type-body);
  -webkit-font-smoothing: antialiased;
  /* EVERY DIGIT ON THE STAGE IS THE SAME WIDTH AS EVERY OTHER (#212's own
   * "numerais em tabular"). A metric beside a metric, a column of a table, a
   * date beside a date -- proportional figures make each one a slightly
   * different width and the row wobbles; this touches no letter that is not
   * a digit, so it costs nothing on the patterns that carry no number. */
  font-variant-numeric: tabular-nums;
}

.stage {
  position: relative;
  width: var(--stage-width);
  height: var(--stage-height);
  overflow: hidden;
  background: var(--surface);
}

/* ── a slide ────────────────────────────────────────────────────────────────
 * Every slide occupies the whole stage; the current one is the one that is
 * painted. `is-current` is set on the first slide BY THE COMPILER rather than
 * by the script, so a stage whose script never ran still shows slide one
 * instead of a black rectangle.
 */
.slide {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  padding: calc(var(--stage-height) * 0.105) calc(var(--stage-height) * 0.095);
}

.slide.is-current { display: flex; }

/* The inline vocabulary closes here (#211): bold and an accent-coloured
 * highlight, always available, plus a forced break the pattern itself has to
 * permit (compiler/catalog.py's own Pattern.allow_break). `<em>` is gone --
 * italic said nothing between these two that they do not already say, and a
 * vocabulary that keeps one tag per ticket is one nobody holds in their head
 * while writing a deck.
 *
 * NEITHER GOES PAST WEIGHT 600. The identity this skill is heading for tops
 * out there, so a bolder bold is a promise no custom font can keep -- capping
 * `strong` at the same ceiling now is what keeps the day panlabs lands from
 * being the day every existing deck's emphasis gets quietly thinner. */
.slide strong { font-weight: 600; }

/* The accent as a marker under the words, not a fill behind them -- a filled
 * highlight is a block, and this theme's identity is hairlines instead of
 * blocks. `<mark>`'s own UA default (a solid background) is undone first. */
.slide mark {
  background: none;
  color: inherit;
  text-decoration: underline;
  text-decoration-color: var(--accent);
  text-decoration-thickness: 0.045em;
  text-underline-offset: 0.16em;
  text-decoration-skip-ink: none;
}

/* ── an icon ─────────────────────────────────────────────────────────────
 * Sized off the same body step every BODY-role slot reads at, so an icon
 * beside a line of prose sits at that line's own cap-height rather than at a
 * size some other slot happened to pick. The accent is the one colour this
 * theme spends on a glyph doing a bullet's job.
 */
.icon {
  width: var(--type-body);
  height: var(--type-body);
  flex: none;
  fill: none;
  stroke: var(--accent);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ── a slot, by what it is for ──────────────────────────────────────────────
 * A slot is set by its ROLE and not by which pattern it happens to sit in.
 * `data-role` comes from the register (compiler/catalog.py) and rides on the
 * paragraph the compiler emits, so a pattern that gains a `meta` line in a
 * later ticket inherits this treatment instead of restating it -- and the
 * register stays the only place that decides what a slot is.
 *
 * A PATTERN BELOW ONLY EVER ADDS COMPOSITION: the measure, and where in the
 * stage the slot sits. The one exception is the two-step lift a `body` slot
 * gets when it is the SOLE sentence on an otherwise sparse slide (thesis-title,
 * closing-call, below) -- themes/base/tokens.css names it `--type-lead` and
 * explains why a lone sentence earns the bigger step. Nowhere else does a
 * pattern touch a face or a size.
 */
.slide > p { margin: 0; max-width: 76%; }

.slide [data-role="claim"],
.slide [data-role="name"],
.slide [data-role="figure"] {
  font-family: var(--font-display);
  font-size: var(--type-display);
  font-weight: 600;
  line-height: 1.08;
  letter-spacing: -0.02em;
  text-wrap: balance;
}

/* THE STEP FOR REAL PROSE. A single sentence alone on the stage (the
 * exception above) reads the bigger --type-lead instead; everything else
 * that carries the BODY role -- a column, a comparison's side, a list
 * item -- is exactly the "patterns that carry real paragraphs" tokens.css
 * held this step open for.
 */
.slide [data-role="body"] {
  font-size: var(--type-body);
  line-height: 1.4;
  color: var(--ink-muted);
  text-wrap: pretty;
}

/* The small print of a slide: the label, the index, the source, the date. It
 * sits exactly on the type floor, in the same face as the page number,
 * because both are the deck talking ABOUT itself rather than saying
 * something -- and nothing in a deck is ever smaller than this. */
.slide [data-role="meta"] {
  font-family: var(--font-mono);
  font-size: var(--type-floor);
  line-height: 1.3;
  letter-spacing: 0.08em;
  color: var(--ink-muted);
}

/* ── a group's container, and its items (#212) ──────────────────────────────
 * `<ul>`, `<ol>` and `<table>` are the only tags besides `<p>` a pattern may
 * write, and the browser's own idea of a list or a table is furniture this
 * dialect never asked for -- bullets, indent, cell spacing. Stripped here,
 * once, so every pattern that carries a group starts from the same blank
 * page a slot does; what each pattern below adds is composition, same rule
 * as the roles above it.
 */
.slide ul, .slide ol { list-style: none; margin: 0; padding: 0; }
.slide li, .slide table, .slide th, .slide td { margin: 0; padding: 0; }
.slide li > p { margin: 0; max-width: none; }
.slide table { border-collapse: collapse; width: 100%; }
.slide th, .slide td { text-align: left; font-weight: inherit; }

/* ── how a few-word slide holds the stage ───────────────────────────────────
 * Every pattern here says almost nothing, and almost nothing is exactly what
 * leaves a projector half dark: the render gate refuses a slide whose content
 * spans less of the stage height than the floor gate/render.cjs carries as
 * OCCUPANCY_MIN_RATIO. The composition that survives it is an ANCHOR and a
 * HORIZON -- something small on the top edge, something large on the bottom
 * one, and the stage as the pause between them.
 *
 * `margin-top: auto` in a flex column is what draws it: each `auto` eats an
 * equal share of the leftover height, so two of them put one slot at the top
 * and one at the bottom, and an `auto` on both sides of a slot centres it in
 * whatever is left and pushes the rest of the slide down. The layout
 * therefore holds whether or not the OPTIONAL slots were written, which is
 * why every slot a composition leans on is a required one in the register.
 */

/* ── pattern · cover-headline ───────────────────────────────────────────────
 * The kicker on the top edge, the occasion on the bottom one, the headline in
 * the air between them.
 */
.slide[data-pattern="cover-headline"] .title { margin-top: auto; max-width: 84%; }

.slide[data-pattern="cover-headline"] .subtitle {
  margin-top: 0.55em;
  max-width: 58%;
}

.slide[data-pattern="cover-headline"] .meta { margin-top: auto; }

/* ── pattern · cover-numbered ───────────────────────────────────────────────
 * The number leads and the title is the line that says what it counts, so the
 * figure keeps the display size, the title follows one step down and hugging
 * it, and the source line holds the bottom edge.
 */
.slide[data-pattern="cover-numbered"] .number {
  margin-top: auto;
  letter-spacing: -0.04em;
}

.slide[data-pattern="cover-numbered"] .title {
  margin-top: 0.14em;
  font-size: var(--type-title);
  max-width: 82%;
}

.slide[data-pattern="cover-numbered"] .meta { margin-top: auto; }

/* ── pattern · pivot-question ───────────────────────────────────────────────
 * The label announces the turn; the question sits in the middle of the stage
 * in a narrow measure, so that even a short one breaks into more than a line.
 */
.slide[data-pattern="pivot-question"] .question {
  margin-top: auto;
  margin-bottom: auto;
  max-width: 68%;
}

/* ── pattern · thesis-title ─────────────────────────────────────────────────
 * The claim in the upper third, the one sentence on the bottom edge under a
 * hairline. The air between them is the pattern, not a gap somebody forgot --
 * and the claim sits at the optical centre rather than on the top edge,
 * because a heavy block against an edge with an empty middle reads as a slide
 * that failed to load.
 */
.slide[data-pattern="thesis-title"] .title { margin-top: auto; max-width: 82%; }

.slide[data-pattern="thesis-title"] .sentence {
  margin-top: auto;
  max-width: 100%;
  padding-top: calc(var(--stage-height) * 0.030);
  border-top: calc(var(--stage-height) * 0.0015) solid var(--hairline);
  font-size: var(--type-lead); /* the one sentence alone -- see the note above [data-role="body"] */
}

/* ── pattern · big-number (#212) ─────────────────────────────────────────────
 * The same anchor-and-horizon as cover-numbered, spent mid-deck instead of at
 * the open: the figure leads, the caption says what it proves one step below
 * it, and the source line -- when written -- holds the bottom edge.
 */
.slide[data-pattern="big-number"] .number {
  margin-top: auto;
  letter-spacing: -0.04em;
}

.slide[data-pattern="big-number"] .caption {
  margin-top: 0.14em;
  font-size: var(--type-title);
  max-width: 82%;
}

.slide[data-pattern="big-number"] .meta { margin-top: auto; }

/* ── pattern · inline-metrics (#212) ──────────────────────────────────────────
 * The claim holds the top edge; the row of metrics is the horizon, each one a
 * small column of its own -- the number leading, the label naming what it
 * measures. `--type-title` and not `--type-display` on the value, because up
 * to four of them share the stage's width and a display-size row of four
 * would not fit it.
 */
.slide[data-pattern="inline-metrics"] .claim {
  margin-top: auto;
  max-width: 88%;
}

.slide[data-pattern="inline-metrics"] ul {
  margin-top: auto;
  margin-bottom: auto;
  display: flex;
  gap: calc(var(--stage-height) * 0.075);
}

.slide[data-pattern="inline-metrics"] li {
  display: flex;
  flex-direction: column;
  gap: 0.28em;
}

.slide[data-pattern="inline-metrics"] [data-role="figure"] {
  font-size: var(--type-title);
  letter-spacing: -0.02em;
}

/* ── pattern · timeline (#212) ────────────────────────────────────────────────
 * The claim holds the top edge; the milestones sit on one hairline that runs
 * the width of the stage, a dot per marker, each label naming its moment and
 * its date sitting under it at floor size. The role is NAME and not CLAIM
 * (compiler/catalog.py's own note on why) -- a milestone names what happened,
 * it does not argue for it. `now`, when one marker carries it, is the one
 * place this pattern spends the accent.
 */
.slide[data-pattern="timeline"] .claim {
  margin-top: auto;
  max-width: 88%;
}

.slide[data-pattern="timeline"] ol {
  margin-top: auto;
  margin-bottom: auto;
  display: flex;
  gap: calc(var(--stage-height) * 0.04);
  padding-top: calc(var(--stage-height) * 0.045);
  border-top: calc(var(--stage-height) * 0.0015) solid var(--hairline);
}

.slide[data-pattern="timeline"] li {
  flex: 1;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 0.22em;
}

.slide[data-pattern="timeline"] li::before {
  content: "";
  position: absolute;
  top: calc(var(--stage-height) * -0.045 - var(--stage-height) * 0.006);
  left: 0;
  width: calc(var(--stage-height) * 0.012);
  height: calc(var(--stage-height) * 0.012);
  border-radius: 50%;
  background: var(--ink-muted);
}

.slide[data-pattern="timeline"] li[now]::before { background: var(--accent); }

.slide[data-pattern="timeline"] [data-role="name"] {
  font-size: var(--type-lead);
  font-weight: 600;
  letter-spacing: -0.01em;
}

.slide[data-pattern="timeline"] li[now] [data-role="name"] { color: var(--accent); }

/* ── pattern · table (#212) ───────────────────────────────────────────────────
 * The claim holds the top edge; the table is the horizon, set at
 * `--type-body` -- the step themes/base/tokens.css named for this pattern by
 * number before this ticket ever wrote one. The header reads like a `meta`
 * line (mono, muted, at floor size) because it names the columns, it does
 * not argue for anything; the body rows are the evidence.
 */
.slide[data-pattern="table"] .claim {
  margin-top: auto;
  max-width: 92%;
}

.slide[data-pattern="table"] table {
  margin-top: auto;
  margin-bottom: auto;
  font-size: var(--type-body);
}

.slide[data-pattern="table"] th,
.slide[data-pattern="table"] td {
  padding: calc(var(--stage-height) * 0.016) calc(var(--stage-height) * 0.024)
           calc(var(--stage-height) * 0.016) 0;
  border-bottom: calc(var(--stage-height) * 0.0015) solid var(--hairline);
}

.slide[data-pattern="table"] th {
  font-family: var(--font-mono);
  font-size: var(--type-floor);
  letter-spacing: 0.08em;
  color: var(--ink-muted);
  border-bottom-color: var(--hairline-strong);
  border-bottom-width: calc(var(--stage-height) * 0.003);
}

/* ── pattern · chart (#213) ──────────────────────────────────────────────────
 * The thesis on the top edge, the unit under it, the source on the bottom one,
 * and the drawing holding the air between them. The claim comes down one step
 * from display because a chart slide has two things to say and the picture is
 * the louder of them -- the same step `big-number` spends on its caption.
 *
 * THE PLOT'S BOX IS LOCKED IN STAGE-HEIGHT UNITS, AND IT HAS TO BE. Everything
 * a chart draws lives inside a viewBox, so a text inside it paints at its own
 * size TIMES whatever scale the box happens to impose -- and a box sized by
 * the flex line would take a different scale on a slide with a two-line title.
 * At 1.5 by 0.44 of the stage height the box is exactly the 1350x396 viewBox
 * compiler/charts.py draws into, so one unit is one pixel and the type floor
 * the generator enforces is the type floor the render gate measures. Change
 * either number here and the other has to move with it.
 */
.slide[data-pattern="chart"] .title {
  font-size: var(--type-title);
  max-width: 94%;
}

.slide[data-pattern="chart"] .unit { margin-top: 0.9em; }

.slide[data-pattern="chart"] .plot {
  display: block;
  width: calc(var(--stage-height) * 1.5);
  height: calc(var(--stage-height) * 0.44);
  margin-top: auto;
  margin-bottom: auto;
}

/* The source is written third and read last: the register orders the slots
 * title, unit, source because that is the order they are AUTHORED in, and one
 * line of `order` puts the dated legend under the drawing where a legend
 * belongs -- rather than teaching the compiler a second rule about where a
 * pattern's evidence goes. */
.slide[data-pattern="chart"] .source { order: 1; }

/* ── the chart's own paint ───────────────────────────────────────────────────
 * NOT ONE COLOUR IS WRITTEN INSIDE THE SVG. compiler/charts.py emits geometry
 * and class names and nothing else, and every fill and stroke a chart wears is
 * bound here to a token of the active theme -- which is the whole of #213's
 * "as cores vêm dos tokens; nenhum hex literal no SVG gerado", enforced by
 * construction instead of by a ruler hunting for hexadecimal.
 *
 * A MARKED POINT IS THE ACCENT AND ITS NEIGHBOURS STEP BACK. Painting one mark
 * with the accent is not enough on its own: `base`'s accent is a grey DIMMER
 * than its first content colour, so the singled-out bar would read as the
 * faded one. `:has()` is what makes the emphasis relative -- with nothing
 * marked every mark stays bright, and the moment one is marked the rest recede
 * to the second content colour. A browser without `:has()` paints every mark
 * bright and the accent one on top of them, which is a weaker slide and never
 * a wrong one.
 */
.slide[data-pattern="chart"] .plot text { font-family: var(--font-mono); }
.slide[data-pattern="chart"] .plot .label { fill: var(--ink-muted); }
.slide[data-pattern="chart"] .plot .value { fill: var(--ink); }
.slide[data-pattern="chart"] .plot .callout { fill: var(--accent); }

.slide[data-pattern="chart"] .plot .mark,
.slide[data-pattern="chart"] .plot .dot { fill: var(--content-1); }

.slide[data-pattern="chart"] .plot .mark.is-marked,
.slide[data-pattern="chart"] .plot .dot.is-marked { fill: var(--accent); }

.slide[data-pattern="chart"] .plot:has(.is-marked) .mark:not(.is-marked),
.slide[data-pattern="chart"] .plot:has(.is-marked) .dot:not(.is-marked) {
  fill: var(--content-2);
}

.slide[data-pattern="chart"] .plot .line {
  fill: none;
  stroke: var(--content-1);
  stroke-width: 4;
  stroke-linejoin: round;
  stroke-linecap: round;
}

.slide[data-pattern="chart"] .plot .area {
  fill: var(--content-2);
  fill-opacity: 0.3;
}

.slide[data-pattern="chart"] .plot .grid {
  stroke: var(--hairline);
  stroke-width: 1.5;
}

.slide[data-pattern="chart"] .plot .axis {
  stroke: var(--hairline-strong);
  stroke-width: 2;
}

/* One slice, one colour -- which is why a share is capped at three in the
 * register: the fourth would have to invent a colour the theme never agreed
 * to. THE ORDER IS THE THEME'S OWN, BRIGHTEST FIRST, and it was measured
 * rather than assumed: with the accent leading, `base` painted the 65% slice
 * in a grey DIMMER than the 25% beside it, and the eye went to the wrong one
 * on a slide whose whole title was about the first. A share's slices are read
 * as an order, so they are painted as one. */
.slide[data-pattern="chart"] .plot .slice-1 { fill: var(--content-1); }
.slide[data-pattern="chart"] .plot .slice-2 { fill: var(--accent); }
.slide[data-pattern="chart"] .plot .slice-3 { fill: var(--content-2); }

/* ── pattern · figure-caption (#214) ─────────────────────────────────────────
 * The one pattern whose CONTENT the catalog does not compose, so the stage
 * composes around it instead: the claim on the top edge when it is written,
 * the caption over a hairline on the bottom one, and the figure taking every
 * pixel between them.
 *
 * `flex: 1` IS THE WHOLE OF "a figura pode ocupar o slide inteiro ou dividir o
 * palco com um título-tese". With no title written the figure simply grows
 * into the space the title would have taken -- no selector has to ask which of
 * the two compositions this slide is, and neither does the compiler.
 *
 * THE CAPTION IS AUTHORED SECOND AND READ LAST, the same one line of `order`
 * the chart's dated source spends: the register orders the slots the way they
 * are WRITTEN, and a legend belongs under the thing it names.
 */
.slide[data-pattern="figure-caption"] .title {
  font-size: var(--type-title);
  max-width: 94%;
}

.slide[data-pattern="figure-caption"] .caption {
  order: 1;
  max-width: 100%;
  padding-top: calc(var(--stage-height) * 0.024);
  border-top: calc(var(--stage-height) * 0.0015) solid var(--hairline);
}

/* THE PAINT IS SET ON THE ROOT AND INHERITED, NOT SELECTED PER ELEMENT, and
 * that is the difference between a default and an override. `fill` inherits,
 * and a presentation attribute on a child beats a value inherited from its
 * parent -- so a shape that says `fill="var(--accent)"` gets the accent while
 * a shape that says nothing gets the ink. A rule naming `.figure *` instead
 * would win over every author's own attribute, and the freedom this slot
 * exists to give would be a freedom the stage quietly took back.
 *
 * The face is the body's, and it is NOT the author's to set (no `font-family`
 * in the register's attributes): a figure is a diagram, and one deck's
 * diagrams reading in three faces is the "pilha" #207 refuses.
 */
.slide[data-pattern="figure-caption"] .figure {
  display: block;
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  height: auto;
  margin: calc(var(--stage-height) * 0.035) 0;
  fill: var(--ink);
  font-family: var(--font-body);
  /* An imported picture is letterboxed inside its box exactly the way a
   * drawing with a viewBox already is. Neither is ever stretched to fill the
   * stage: a figure distorted to fit is a figure lying about a shape. */
  object-fit: contain;
}

/* ── pattern · pull-quote ───────────────────────────────────────────────────
 * The quote in the air with the accent running down its side -- the one mark
 * that says "these are not our words" without spending a colour on it -- and
 * the attribution on the bottom edge.
 */
.slide[data-pattern="pull-quote"] .quote {
  margin-top: auto;
  max-width: 78%;
  padding-left: calc(var(--stage-height) * 0.038);
  border-left: calc(var(--stage-height) * 0.003) solid var(--accent);
}

.slide[data-pattern="pull-quote"] .attribution { margin-top: auto; }

/* ── pattern · section-divider ──────────────────────────────────────────────
 * The one slide allowed to be nearly empty: the chapter's number standing on
 * the top edge, the name of the section on the bottom one over a rule that
 * crosses the whole stage, and the pause between them. The number is set one
 * step down from the name and in the muted ink -- it counts the section, it
 * does not announce it.
 */
.slide[data-pattern="section-divider"] .index {
  font-size: var(--type-title);
  letter-spacing: -0.02em;
  color: var(--ink-muted);
}

.slide[data-pattern="section-divider"] .title {
  margin-top: auto;
  max-width: 100%;
  padding-top: calc(var(--stage-height) * 0.040);
  border-top: calc(var(--stage-height) * 0.0015) solid var(--hairline-strong);
}

/* ── pattern · closing-call ─────────────────────────────────────────────────
 * The mirror of thesis-title: the thesis comes back small on the top edge,
 * the ask holds the middle in the biggest type on the stage, and where the
 * conversation continues sits on the bottom edge. The `auto` on both sides of
 * the ask is what puts the optional line at the foot of the stage without the
 * pattern depending on it being written.
 */
.slide[data-pattern="closing-call"] .thesis {
  max-width: 58%;
  font-size: var(--type-lead); /* the one sentence alone -- see the note above [data-role="body"] */
}

.slide[data-pattern="closing-call"] .call {
  margin-top: auto;
  margin-bottom: auto;
  max-width: 72%;
}

/* ── pattern · full-bleed-statement ─────────────────────────────────────────
 * One sentence, at display size, holding the stage on its own. The measure is
 * a fraction of the stage rather than a count of characters: it has to break
 * into three or four lines at any projector size, because a statement that
 * lands on one line reads as a caption.
 */
.slide[data-pattern="full-bleed-statement"] { justify-content: center; }

/* ── how a slide of evidence holds the stage (#211) ─────────────────────────
 * Four patterns, one trick: the CATALOG's own slot order IS the reading
 * order a CSS grid auto-places into, so no selector below ever names a
 * column or a row by number. `two-columns` declares title, column-a,
 * column-b; a two-column grid puts the title on its own row (spanning, via
 * `grid-column: 1 / -1`) and the pair beneath it without one line of CSS per
 * slot. Change the register's slot order and the grid reads the new one --
 * that is what "the pattern only ever adds composition" buys here.
 *
 * `.is-current` HAS TO BE PART OF THE SELECTOR, NOT JUST THE CONTEXT. An
 * attribute selector and a class carry the same specificity weight, so
 * `.slide[data-pattern=…] { display: grid }` alone ties with, and by source
 * order beats, `.slide.is-current { display: flex }` above -- every slide of
 * these four patterns would paint at once, current or not. Naming
 * `.is-current` here is what keeps the toggle the only thing deciding which
 * slide is on the stage.
 */
.slide[data-pattern="two-columns"].is-current,
.slide[data-pattern="three-columns"].is-current,
.slide[data-pattern="comparison"].is-current,
.slide[data-pattern="icon-list"].is-current {
  display: grid;
  align-content: center;
  row-gap: calc(var(--stage-height) * 0.045);
}

.slide[data-pattern="two-columns"] .title,
.slide[data-pattern="three-columns"] .title,
.slide[data-pattern="comparison"] .title,
.slide[data-pattern="icon-list"] .title {
  grid-column: 1 / -1;
  max-width: 88%;
  margin-bottom: calc(var(--stage-height) * 0.015);
}

.slide[data-pattern="two-columns"] [data-role="body"],
.slide[data-pattern="three-columns"] [data-role="body"],
.slide[data-pattern="comparison"] [data-role="body"] {
  max-width: 100%;
}

.slide[data-pattern="two-columns"] { grid-template-columns: repeat(2, 1fr); column-gap: calc(var(--stage-height) * 0.06); }
.slide[data-pattern="three-columns"] { grid-template-columns: repeat(3, 1fr); column-gap: calc(var(--stage-height) * 0.05); }

/* ── pattern · comparison ────────────────────────────────────────────────────
 * The register orders its slots title, label-a, label-b, body-a, body-b, so
 * the same two-column auto-flow that stacks two `two-columns` slots instead
 * pairs a label row over a body row -- and a hairline down the middle is the
 * one thing the grid cannot draw on its own.
 */
.slide[data-pattern="comparison"] {
  grid-template-columns: 1fr 1fr;
  column-gap: calc(var(--stage-height) * 0.06);
}

.slide[data-pattern="comparison"] .label-a,
.slide[data-pattern="comparison"] .label-b {
  align-self: end;
}

.slide[data-pattern="comparison"]::before {
  content: "";
  position: absolute;
  left: 50%;
  top: calc(var(--stage-height) * 0.30);
  bottom: calc(var(--stage-height) * 0.10);
  width: calc(var(--stage-height) * 0.0015);
  background: var(--hairline);
}

/* ── pattern · icon-list ──────────────────────────────────────────────────────
 * An icon column and a text column, auto-filled two slots at a time -- the
 * register's item-N-icon, item-N-text pairs land one row per item without a
 * selector naming which row. Never more than five: the sixth pair has no
 * slot the catalog declares, and the vocabulary ruler refuses it before this
 * rule is ever asked to lay one out.
 */
.slide[data-pattern="icon-list"] {
  grid-template-columns: auto 1fr;
  column-gap: calc(var(--stage-height) * 0.03);
  align-items: center;
}

.slide[data-pattern="icon-list"] [data-role="body"] { max-width: 100%; }

/* ── the page number ────────────────────────────────────────────────────────
 * One element, outside every slide, in the same corner of the stage from the
 * first slide to the last -- which is the only way it never competes with
 * what is being said. It sits exactly on the type floor: the smallest a deck
 * is allowed to print, and nothing smaller anywhere.
 */
.page-number {
  position: absolute;
  right: calc(var(--stage-height) * 0.045);
  bottom: calc(var(--stage-height) * 0.045);
  font-family: var(--font-mono);
  font-size: var(--type-floor);
  line-height: 1;
  letter-spacing: 0.08em;
  color: var(--ink-muted);
  font-variant-numeric: tabular-nums;
}

/* A machine that was told to move less is told once, here. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body {{DECK_ATTRS}}>
{{ICONS}}
<main class="stage">
{{SLIDES}}
<footer class="page-number"><span data-page-current>1</span>&#8202;/&#8202;<span data-page-total>{{PAGE_TOTAL}}</span></footer>
</main>
<script>
// Arrows, and nothing else yet. The overview, the notes and the fragments
// arrive with the ticket that owns them; a half-built shortcut is worse than
// a missing one, because it teaches a lever that does not work.
(function () {
  var slides = [].slice.call(document.querySelectorAll('.slide'));
  if (!slides.length) return;
  var here = 0;
  var readout = document.querySelector('[data-page-current]');
  var total = document.querySelector('[data-page-total]');
  if (total) total.textContent = String(slides.length);

  function show(n) {
    here = Math.max(0, Math.min(slides.length - 1, n));
    for (var i = 0; i < slides.length; i++) {
      slides[i].classList.toggle('is-current', i === here);
    }
    if (readout) readout.textContent = String(here + 1);
  }

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowRight') { show(here + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { show(here - 1); e.preventDefault(); }
  });

  show(0);
})();
</script>
</body>
</html>
